<script>
    const urlParams = new URLSearchParams(window.location.search);
    const categoryName = urlParams.get('type');
    const mode = urlParams.get('mode') || 'original'; // 'original' or 'cinesubz'
    
    document.getElementById('cat_badge').innerText = mode.toUpperCase() + " API";
    document.getElementById('page_title').innerText = categoryName || "All Movies";
    document.title = (categoryName || "Category") + " | MOVIESTREAM";

    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:6555' : 'https://cinesubz.moviestream.lat';
    const ORIGINAL_API = "https://stream.moviestream.lat/api";
    
    function storeTempData(title, imgUrl) {
        try {
            sessionStorage.setItem('temp_movie_data', JSON.stringify({
                title: decodeURIComponent(title),
                imageUrl: decodeURIComponent(imgUrl)
            }));
        } catch(e) {}
    }
    
    let currentPage = 1;
    let isLoading = false;
    
    // For Cinesubz, data is pre-fetched since it's one big JSON
    let cachedCinesubzData = [];

    let allFilteredItems = [];
    let isDataLoaded = false;
    
    async function fetchMovies(page) {
        if (!categoryName) return [];

        if (!isDataLoaded) {
            if (mode === 'cinesubz') {
                try {
                    const res = await fetch(`${API_BASE}/api/homepage?t=${new Date().getTime()}`);
                    const json = await res.json();
                    if (json) {
                        const targetCat = (categoryName || '').toLowerCase().trim();
                        if (targetCat.includes('all')) {
                            // Merge all categories together
                            allFilteredItems = Object.values(json).flat();
                        } else {
                            for (const key in json) {
                                if (key.toLowerCase().trim() === targetCat) {
                                    allFilteredItems = json[key];
                                    break;
                                }
                            }
                        }
                    }
                } catch(e) { console.error(e); }
            } else {
                try {
                    // Fetch original movies dump for blazing fast client-side sorting and filtering
                    const res = await fetch(`https://panel.moviestream.lat/api/movies?v=${new Date().getTime()}`);
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        if (categoryName.toLowerCase().includes('all') || categoryName.includes('Trending') || categoryName.includes('Popular') || categoryName.includes('New') || categoryName === 'Movies') {
                            allFilteredItems = data;
                        } else {
                            allFilteredItems = data.filter(m => {
                                const catStr = (m.categories || '').toLowerCase();
                                const typeStr = (m.type || '').toLowerCase();
                                const search = categoryName.toLowerCase().replace(/movies?|tv|series/g, '').trim();
                                if (!search) return true;
                                return catStr.includes(search) || typeStr.includes(search);
                            });
                        }
                    }
                } catch(e) { console.error(e); }
            }
            isDataLoaded = true;
        }

        const itemsPerPage = 20;
        const startIndex = (page - 1) * itemsPerPage;
        return allFilteredItems.slice(startIndex, startIndex + itemsPerPage);
    }

    function renderCards(items) {
        let cardsHtml = '';
        const isCinesubz = mode === 'cinesubz';
        
        items.forEach((m, idx) => {
            const id = isCinesubz ? encodeURIComponent(m.url) : (m.id || m.subjectId || m._id || ('scrap_' + idx));
            const detailPath = isCinesubz ? '' : (m.detailPath || id);
            const finalId = isCinesubz ? id : (detailPath || id);
            const safeFinalId = finalId ? finalId.toString().replace(/'/g, "%27") : '';
            const sourceMode = isCinesubz ? 'cs' : 'original';
            const imgUrl = m.imageUrl || m.cover?.url || m.coverUrl || m.cover || m.pic || m.image || 'https://via.placeholder.com/200x300';
            const quality = m.quality || m.type || 'HD';
            const title = m.title || m.name || 'Unknown';
            
            const safeTitle = encodeURIComponent(title).replace(/'/g, "%27");
            const safeImg = encodeURIComponent(imgUrl).replace(/'/g, "%27");
            cardsHtml += `
                <div class="movie-card relative w-full aspect-[2/3] rounded-lg overflow-hidden border border-white/10 cursor-pointer bg-surface-container-low" onclick="openMovieModal('${safeFinalId}', '${sourceMode}', '${safeTitle}', '${safeImg}', '${detailPath}')">
                    <img src="${imgUrl}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                    <div class="movie-overlay absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent opacity-0 transition-opacity duration-300 flex flex-col justify-end p-4 backdrop-blur-[2px]">
                        <h3 class="font-label-bold text-label-bold text-on-surface mb-2 truncate drop-shadow-md">${title}</h3>
                        <div class="flex gap-2">
                            ${isCinesubz ? `<span class="text-[10px] font-bold px-1.5 py-0.5 bg-primary-container text-on-primary-container rounded shadow-[0_0_5px_rgba(229,9,20,0.5)]">SINHALA</span>` : ''}
                            <span class="text-[10px] font-bold px-1.5 py-0.5 border border-white/20 text-secondary rounded backdrop-blur-md bg-black/30">${quality}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        return cardsHtml;
    }

    async function loadMore() {
        if (isLoading) return;
        isLoading = true;
        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('btn_load_more').classList.add('opacity-50');
        
        const items = await fetchMovies(currentPage);
        
        if (items && items.length > 0) {
            document.getElementById('movies_grid').insertAdjacentHTML('beforeend', renderCards(items));
            currentPage++;
            document.getElementById('btn_load_more').classList.remove('hidden');
        } else {
            // No more items
            document.getElementById('btn_load_more').classList.add('hidden');
            if (currentPage === 1) {
                document.getElementById('movies_grid').innerHTML = `<div class="col-span-full text-center py-10 text-secondary">No movies found in this category.</div>`;
            }
        }
        
        isLoading = false;
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('btn_load_more').classList.remove('opacity-50');
    }

    // Init
    loadMore();
</script>

                    <!-- TV Series Section (Hidden for movies) -->
                    <div id="modal_tv_section" class="mb-6 hidden">

                            <!-- Episodes -->
                        </div>
                    </div>

                    <!-- Request Form -->
                    <div class="bg-surface-container border border-white/5 rounded-xl p-5 relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent pointer-events-none"></div>

<script>
// --- MODAL & KAVIBOT LOGIC ---
let KAVIBOT_API = "https://api.moviestream.lat/send-movie";
let currentMovieData = null;
let currentDirectLink = null;
let currentSubtitleUrl = null;
let currentSeriesData = null;

function openMovieModal(id, source, title, imgUrl, detailPath) {
    const modal = document.getElementById('movie_modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    setTimeout(() => modal.classList.remove('opacity-0'), 10);
    
    document.getElementById('modal_title').innerText = decodeURIComponent(title);
    document.getElementById('modal_hero_img').src = decodeURIComponent(imgUrl) || 'https://via.placeholder.com/1280x720?text=No+Image';
    document.getElementById('modal_meta').innerHTML = '';
    document.getElementById('modal_desc').innerText = 'Fetching details...';
    
    document.getElementById('modal_loader').classList.remove('hidden');
    document.getElementById('modal_content_area').classList.add('hidden');
    document.getElementById('modal_tv_section').classList.add('hidden');
    document.getElementById('wa_status').classList.add('hidden');
    document.getElementById('direct_download_buttons').innerHTML = '';
    
    currentMovieData = { title: decodeURIComponent(title), originalTitle: decodeURIComponent(title), id, source, detailPath };
    currentDirectLink = null;
    currentSubtitleUrl = null;
    currentSeriesData = null;
    
    fetchMovieDetails(id, source, detailPath);
}

function closeMovieModal() {
    const modal = document.getElementById('movie_modal');
    modal.classList.add('opacity-0');
    setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }, 300);
}

async function fetchMovieDetails(id, source, detailPath) {
    try {
        if (source === 'cs') {
            const apiEndpoint = `${API_BASE}/api/details?url=${id}`;
            const res = await fetch(apiEndpoint);
            const data = await res.json();
            const details = data.details || data;
            
            document.getElementById('modal_desc').innerText = details.synopsis || 'No description available.';
            document.getElementById('modal_meta').innerHTML = `
                <span class="px-2 py-0.5 bg-primary/20 text-primary rounded">${details.quality || 'HD'}</span>
                <span>${details.year || ''}</span>
                ${details.imdb && details.imdb !== 'N/A' ? `<span class="px-2 py-0.5 bg-yellow-500/20 text-yellow-400 rounded">⭐ ${details.imdb}</span>` : ''}
            `;
            
            if (details.seasons && details.seasons.length > 0) {
                setupTvSeriesCinesubz(details.seasons);
            } else {
                extractMovieLinkCinesubz(details);
            }
        } else {
            // Original source
            const pathParam = encodeURIComponent(detailPath || id);
            const detailRes = await fetch(`https://stream.moviestream.lat/api/detail2?id=${id}&path=${pathParam}`);
            const data = await detailRes.json();
            
            document.getElementById('modal_desc').innerText = data.description || 'No description available.';
            document.getElementById('modal_meta').innerHTML = `
                <span class="px-2 py-0.5 bg-primary/20 text-primary rounded">${data.quality || 'HD'}</span>
                <span>${data.year || ''}</span>
            `;
            
            if (data.isTvSeries || (data.seasons && data.seasons.length > 0)) {
                setupTvSeriesOriginal(data, pathParam);
            } else {
                extractMovieLinkOriginal(data);
            }
        }
    } catch (e) {
        console.error("Error fetching details:", e);
        document.getElementById('modal_desc').innerText = "Error loading details.";
        document.getElementById('modal_loader').classList.add('hidden');
    }
}

function renderDownloadButtons(downloadLinks) {
    const container = document.getElementById('direct_download_buttons');
    if (!downloadLinks || downloadLinks.length === 0) {
        container.innerHTML = `<div class="col-span-full text-xs text-secondary bg-white/5 p-3 rounded-lg text-center">No direct links available at this moment.</div>`;
        return;
    }
    
    let html = '';
    downloadLinks.forEach((dl, idx) => {
        const url = dl.real_direct_download_url || dl.url || dl.link;
        if (!url || !url.startsWith('http')) return;
        
        let label = dl.quality_info || dl.quality || `Download Link ${idx + 1}`;
        let icon = 'download';
        if (url.includes('pixeldrain.com')) icon = 'cloud_download';
        else if (url.includes('drive') || url.includes('skylines')) icon = 'play_circle';
        
        html += `
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between bg-surface-container-low hover:bg-primary-container/20 border border-white/10 hover:border-primary/50 text-white rounded-xl px-4 py-3 text-xs md:text-sm font-medium transition-all group shadow-sm">
                <div class="flex items-center gap-2 truncate">
                    <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">${icon}</span>
                    <span class="truncate">${label}</span>
                </div>
                <span class="material-symbols-outlined text-xs text-secondary group-hover:text-white shrink-0">open_in_new</span>
            </a>
        `;
    });
    container.innerHTML = html;
}

function extractMovieLinkCinesubz(data) {
    const links = data.download_links || data.links || [];
    renderDownloadButtons(links);
    
    const extractLink = (linksObj) => {
        if (!linksObj || !linksObj.length) return null;
        const isValid = (u) => u && typeof u === 'string' && u.startsWith('http') && !u.includes('cinesubz.net/movies') && !u.includes('cinesubz.net/episodes') && !u.includes('cinesubz.net/tvshows');
        const getBest = (l) => {
            if (isValid(l.real_direct_download_url)) return l.real_direct_download_url;
            if (isValid(l.url)) return l.url;
            if (isValid(l.link)) return l.link;
            if (isValid(l.cinesubz_link)) return l.cinesubz_link;
            return null;
        };
        const link720 = linksObj.find(l => (l.quality_info || l.quality || '').includes('720'));
        if (link720) {
            const best = getBest(link720);
            if (best) return best;
        }
        for (let l of linksObj) {
            const best = getBest(l);
            if (best) return best;
        }
        return null;
    };
    currentDirectLink = extractLink(links) || data.direct_url || data.url || data.link || null;
    showForm();
}

function extractMovieLinkOriginal(data) {
    const links = data.qualities || data.download_links || data.links || [];
    renderDownloadButtons(links);
    
    const extractLink = (linksObj) => {
        if (!linksObj || !linksObj.length) return null;
        const isValid = (u) => u && typeof u === 'string' && u.startsWith('http') && !u.includes('cinesubz.net/movies') && !u.includes('cinesubz.net/episodes') && !u.includes('cinesubz.net/tvshows');
        const getBest = (l) => {
            if (isValid(l.real_direct_download_url)) return l.real_direct_download_url;
            if (isValid(l.url)) return l.url;
            if (isValid(l.link)) return l.link;
            if (isValid(l.cinesubz_link)) return l.cinesubz_link;
            return null;
        };
        const link720 = linksObj.find(l => (l.quality_info || l.quality || '').includes('720'));
        if (link720) {
            const best = getBest(link720);
            if (best) return best;
        }
        for (let l of linksObj) {
            const best = getBest(l);
            if (best) return best;
        }
        return null;
    };
    currentDirectLink = extractLink(links) || data.direct_url || data.url || data.link || null;
    
    if (data.subtitles) {
        const siSub = data.subtitles.find(s => s.language === 'Sinhala' || s.lang === 'si');
        if (siSub) currentSubtitleUrl = `https://stream.moviestream.lat/api/subtitle/proxy?url=${encodeURIComponent(siSub.url)}&lang=si_native`;
    }
    
    showForm();
}

    const seasonsMap = {};
    seasons.forEach(s => {
        const sName = `Season ${s.season_num || 1}`;
        seasonsMap[sName] = s.episodes || [];
    });
    currentSeriesData = seasonsMap;
    
    const seasonSelect = document.getElementById('season_select');
    seasonSelect.innerHTML = '';
    Object.keys(seasonsMap).forEach(s => {

    document.getElementById('modal_tv_section').classList.remove('hidden');

    showForm();
}

async function setupTvSeriesOriginal(data, pathParam) {
    document.getElementById('modal_tv_section').classList.remove('hidden');
    try {
        const sRes = await fetch(`https://stream.moviestream.lat/api/series-info?path=${pathParam}`);
        const sData = await sRes.json();
        
        const seasonsMap = {};
        if (sData.seasons) {
            sData.seasons.forEach((season, idx) => {

                seasonsMap[sName] = season.episodes || [];

        const seasonSelect = document.getElementById('season_select');
        seasonSelect.innerHTML = '';

function loadEpisodes(seasonName, source) {
    const episodes = currentSeriesData[seasonName] || [];
    const list = document.getElementById('episodes_list');
    list.innerHTML = '';
    
    episodes.forEach((ep, idx) => {
        const title = ep.episode || ep.title || ep.name || `Episode ${ep.num || idx + 1}`;
        list.innerHTML += `
            <button type="button" onclick="selectEpisode(${idx}, '${seasonName.replace(/'/g, "\\'")}')" id="ep_btn_${idx}" class="series-episode-btn w-full text-left bg-surface-container-low hover:bg-white/10 border border-white/5 rounded-xl px-4 py-3 text-sm text-on-surface transition-all font-medium hover:border-primary/50">
                ${title}
            </button>
        `;
    });
    
    if (episodes.length > 0) {
        selectEpisode(0, seasonName);
    }
}

async function selectEpisode(idx, seasonName) {
    document.querySelectorAll('.series-episode-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(`ep_btn_${idx}`);
    if (btn) btn.classList.add('active');
    
    const ep = currentSeriesData[seasonName][idx];
    currentMovieData.title = `${currentMovieData.originalTitle} - ${seasonName} ${ep.name || ep.title || ep.ep_num || ep.num || 'EP'}`;
    
    const extractLink = (linksObj) => {
        if (!linksObj || !linksObj.length) return null;
        const isValid = (u) => u && typeof u === 'string' && u.startsWith('http') && !u.includes('cinesubz.net/movies') && !u.includes('cinesubz.net/episodes') && !u.includes('cinesubz.net/tvshows');
        const getBest = (l) => {
            if (isValid(l.real_direct_download_url)) return l.real_direct_download_url;
            if (isValid(l.url)) return l.url;
            if (isValid(l.link)) return l.link;
            if (isValid(l.cinesubz_link)) return l.cinesubz_link;
            return null;
        };
        const link720 = linksObj.find(l => (l.quality_info || l.quality || '').includes('720'));
        if (link720) {
            const best = getBest(link720);
            if (best) return best;
        }
        for (let l of linksObj) {
            const best = getBest(l);
            if (best) return best;
        }
        return null;
    };

    currentDirectLink = extractLink(ep.download_links) || 
                        extractLink(ep.links) || 
                        extractLink(ep.downloadLinks) || 
                        extractLink(ep.qualities) || 
                        ep.direct_url || ep.url || ep.link || null;

    if (currentMovieData.source === 'cs' && ep.url) {
        try {
            const btnContainer = document.getElementById('direct_download_buttons');
            btnContainer.innerHTML = `<div class="col-span-full flex items-center justify-center gap-2 text-xs text-primary py-2"><div class="w-4 h-4 border-2 border-primary/20 border-t-primary rounded-full animate-spin"></div> Loading episode download links...</div>`;
            
            const res = await fetch(`${API_BASE}/api/details?url=${encodeURIComponent(ep.url)}`);
            const data = await res.json();
            const epDetails = data.details || data;
            
            const epLinks = epDetails.download_links || epDetails.links || [];
            renderDownloadButtons(epLinks);
            
            currentDirectLink = extractLink(epLinks) || currentDirectLink;
        } catch(e) {
            console.error("Failed to load episode links", e);
        }
    } else if (ep.download_links || ep.links) {
        renderDownloadButtons(ep.download_links || ep.links);
    }
}

function showForm() {
    document.getElementById('modal_loader').classList.add('hidden');
    document.getElementById('modal_content_area').classList.remove('hidden');
}

function normalizePhoneNumber(rawNumber) {
    if (!rawNumber) return "";
    let clean = String(rawNumber).replace(/[^0-9]/g, '');
    if (clean.startsWith('00')) clean = clean.substring(2);
    if (clean.startsWith('0') && clean.length === 10) {
        clean = '94' + clean.substring(1);
    } else if (clean.length === 9 && (clean.startsWith('7') || clean.startsWith('1') || clean.startsWith('2') || clean.startsWith('3') || clean.startsWith('4') || clean.startsWith('5') || clean.startsWith('6') || clean.startsWith('8') || clean.startsWith('9'))) {
        clean = '94' + clean;
    }
    return clean;
}

async function sendToWhatsApp(e) {
    e.preventDefault();
    if (!currentDirectLink) {
        showWaStatus("Error: Could not find a valid download link.", "error");
        return;
    }
    
    const name = document.getElementById('wa_name').value.trim() || 'User';
    const rawNumber = document.getElementById('wa_number').value;
    const number = normalizePhoneNumber(rawNumber);
    const btn = document.getElementById('wa_submit_btn');

    if (!number || number.length < 9) {
        showWaStatus("❌ Please enter a valid WhatsApp number (e.g. 0771234567).", "error");
        return;
    }
    
    btn.disabled = true;
    btn.innerHTML = `<div class="w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin"></div> Sending...`;
    
    const payload = {
        movieName: currentMovieData.title,
        directLink: currentDirectLink,
        number: number,
        userName: name,
        subtitleUrl: currentSubtitleUrl,
        quality: "720p"
    };
    
    try {
        const res = await fetch(KAVIBOT_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        if (res.ok) {
            showWaStatus("✅ Requested! Check your WhatsApp.", "success");
        } else if (res.status === 429) {
            showWaStatus("⚠️ Limit reached. Try again later.", "error");
        } else {
            showWaStatus("❌ Failed to send request.", "error");
        }
    } catch (err) {
        console.error(err);
        showWaStatus("❌ Network error. Is Kavibot running?", "error");
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined">send</span> Send to WhatsApp`;
    }
}

function showWaStatus(msg, type) {
    const el = document.getElementById('wa_status');
    el.innerText = msg;
    el.classList.remove('hidden', 'text-error', 'text-green-500');
    el.classList.add(type === 'error' ? 'text-error' : 'text-green-500');
}
