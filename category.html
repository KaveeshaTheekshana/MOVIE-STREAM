<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container relative pt-[100px]">

<nav class="fixed top-0 w-full z-50 bg-black/90 backdrop-blur-xl flex justify-between items-center px-edge-margin-mobile md:px-edge-margin-desktop py-4 w-full transition-all duration-300 border-b border-white/10">
    <div class="flex items-center gap-8">
        <a class="font-display-hero-mobile text-2xl font-black text-primary-container tracking-tighter hover:scale-105 transition-transform" href="index.html">MOVIESTREAM</a>
    </div>
    <div class="flex items-center gap-4">
        <a href="index.html" class="text-on-surface hover:text-primary transition flex items-center gap-2 font-label-bold bg-white/10 px-4 py-2 rounded-full">
            <span class="material-symbols-outlined text-[18px]">home</span> Back Home
        </a>
    </div>
</nav>

<div class="max-w-container-max mx-auto px-edge-margin-mobile md:px-edge-margin-desktop mb-stack-md mt-6">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-l-4 border-primary-container pl-4">
        <div>
            <span id="cat_badge" class="px-2 py-1 bg-white/10 text-secondary rounded text-[10px] font-bold uppercase tracking-widest mb-2 inline-block">Loading...</span>
            <h1 id="page_title" class="font-display-hero-mobile md:font-display-hero text-display-hero-mobile md:text-5xl text-on-surface drop-shadow-lg">Loading Category...</h1>
        </div>
        <div id="loader" class="text-primary font-bold animate-pulse hidden">Fetching content...</div>
    </div>
</div>

<div id="movies_grid" class="max-w-container-max mx-auto grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6 px-edge-margin-mobile md:px-edge-margin-desktop pb-20">
    <!-- Grid injected by JS -->
</div>

<div class="flex justify-center mb-20 px-edge-margin-mobile">
    <button id="btn_load_more" onclick="loadMore()" class="hidden bg-white/10 hover:bg-white/20 text-on-surface font-label-bold py-3 px-8 rounded-full border border-white/20 transition hover:-translate-y-1">Load More</button>
</div>

<footer class="w-full mt-stack-lg border-t border-white/10 bg-black/50 backdrop-blur-xl flex justify-center items-center py-stack-md">
    <div class="font-label-sm text-secondary opacity-70">© 2026 MOVIESTREAM. All rights reserved.</div>
</footer>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const categoryName = urlParams.get('type');
    const mode = urlParams.get('mode') || 'original'; // 'original' or 'cinesubz'
    
    document.getElementById('cat_badge').innerText = mode.toUpperCase() + " API";
    document.getElementById('page_title').innerText = categoryName || "All Movies";
    document.title = (categoryName || "Category") + " | MOVIESTREAM";

    const API_BASE = "https://api.moviestream.lat";
    const ORIGINAL_API = "https://stream.moviestream.lat/api";
    
    function storeTempData(title, imgUrl) {
        try {
            sessionStorage.setItem('temp_movie_data', JSON.stringify({
                title: decodeURIComponent(title),
                imageUrl: decodeURIComponent(imgUrl)
            }));
        } catch(e) {}
    }
    
    let currentPage = 1;
    let isLoading = false;
    
    // For Cinesubz, data is pre-fetched since it's one big JSON
    let cachedCinesubzData = [];

    let allFilteredItems = [];
    let isDataLoaded = false;
    
    async function fetchMovies(page) {
        if (!categoryName) return [];

        if (!isDataLoaded) {
            if (mode === 'cinesubz') {
                try {
                    const res = await fetch(`${API_BASE}/api/homepage?t=${new Date().getTime()}`);
                    const json = await res.json();
                    if (json) {
                        const targetCat = (categoryName || '').toLowerCase().trim();
                        for (const key in json) {
                            if (key.toLowerCase().trim() === targetCat) {
                                allFilteredItems = json[key];
                                break;
                            }
                        }
                    }
                } catch(e) { console.error(e); }
            } else {
                try {
                    // Fetch original movies dump for blazing fast client-side sorting and filtering
                    const res = await fetch(`https://panel.moviestream.lat/api/movies?v=${new Date().getTime()}`);
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        if (categoryName.toLowerCase().includes('all') || categoryName.includes('Trending') || categoryName.includes('Popular') || categoryName.includes('New') || categoryName === 'Movies') {
                            allFilteredItems = data;
                        } else {
                            allFilteredItems = data.filter(m => {
                                const catStr = (m.categories || '').toLowerCase();
                                const typeStr = (m.type || '').toLowerCase();
                                const search = categoryName.toLowerCase().replace(/movies?|tv|series/g, '').trim();
                                if (!search) return true;
                                return catStr.includes(search) || typeStr.includes(search);
                            });
                        }
                    }
                } catch(e) { console.error(e); }
            }
            isDataLoaded = true;
        }

        const itemsPerPage = 20;
        const startIndex = (page - 1) * itemsPerPage;
        return allFilteredItems.slice(startIndex, startIndex + itemsPerPage);
    }

    function renderCards(items) {
        let cardsHtml = '';
        const isCinesubz = mode === 'cinesubz';
        
        items.forEach((m, idx) => {
            const id = isCinesubz ? encodeURIComponent(m.url) : (m.id || m.subjectId || m._id || ('scrap_' + idx));
            const detailPath = isCinesubz ? '' : (m.detailPath || id);
            const finalId = isCinesubz ? id : (detailPath || id);
            const safeFinalId = finalId ? finalId.toString().replace(/'/g, "%27") : '';
            const sourceMode = isCinesubz ? 'cs' : 'original';
            const imgUrl = m.imageUrl || m.cover?.url || m.coverUrl || m.cover || m.pic || m.image || 'https://via.placeholder.com/200x300';
            const quality = m.quality || m.type || 'HD';
            const title = m.title || m.name || 'Unknown';
            
            const safeTitle = encodeURIComponent(title).replace(/'/g, "%27");
            const safeImg = encodeURIComponent(imgUrl).replace(/'/g, "%27");
            cardsHtml += `
                <div class="movie-card relative w-full aspect-[2/3] rounded-lg overflow-hidden border border-white/10 cursor-pointer bg-surface-container-low" onclick="storeTempData('${safeTitle}', '${safeImg}'); window.location.href='movie-details.html?id=${safeFinalId}&source=${mode}'">
                    <img src="${imgUrl}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                    <div class="movie-overlay absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent opacity-0 transition-opacity duration-300 flex flex-col justify-end p-4 backdrop-blur-[2px]">
                        <h3 class="font-label-bold text-label-bold text-on-surface mb-2 truncate drop-shadow-md">${title}</h3>
                        <div class="flex gap-2">
                            ${isCinesubz ? `<span class="text-[10px] font-bold px-1.5 py-0.5 bg-primary-container text-on-primary-container rounded shadow-[0_0_5px_rgba(229,9,20,0.5)]">SINHALA</span>` : ''}
                            <span class="text-[10px] font-bold px-1.5 py-0.5 border border-white/20 text-secondary rounded backdrop-blur-md bg-black/30">${quality}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        return cardsHtml;
    }

    async function loadMore() {
        if (isLoading) return;
        isLoading = true;
        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('btn_load_more').classList.add('opacity-50');
        
        const items = await fetchMovies(currentPage);
        
        if (items && items.length > 0) {
            document.getElementById('movies_grid').insertAdjacentHTML('beforeend', renderCards(items));
            currentPage++;
            document.getElementById('btn_load_more').classList.remove('hidden');
        } else {
            // No more items
            document.getElementById('btn_load_more').classList.add('hidden');
            if (currentPage === 1) {
                document.getElementById('movies_grid').innerHTML = `<div class="col-span-full text-center py-10 text-secondary">No movies found in this category.</div>`;
            }
        }
        
        isLoading = false;
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('btn_load_more').classList.remove('opacity-50');
    }

    // Init
    loadMore();
</script>
</body></html>
