    <style>
        :root {
            --n-red: #E50914;
            --n-blue: #00d2ff;
        }

        * {
            font-style: normal !important;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            scroll-behavior: smooth;
            overflow-x: hidden;
            width: 100%;
            touch-action: pan-y;
        }

        body {
            background-color: #020202;
            color: white;
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
            overflow-x: hidden;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        body.loaded {
            opacity: 1;
        }

        .nav-blur {
            background: rgba(0, 26, 51, 0.4);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 5000;
        }

        .hero-bg {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            background: transparent;
        }

        #hero-3d-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .hero-overlay {
            background: linear-gradient(to top, #020202 0%, #020202 5%, transparent 40%),
                radial-gradient(circle at 20% 50%, rgba(0, 210, 255, 0.1) 0%, rgba(0, 0, 0, 0.5) 100%);
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 20;
            pointer-events: none;
        }

        .hero-content button,
        .hero-content a {
            pointer-events: auto;
        }

        .trending-poster-wrapper {
            position: relative;
            display: inline-block;
            perspective: 1000px;
        }

        .trending-poster {
            width: 200px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 210, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @media (min-width: 768px) {
            .trending-poster {
                width: 320px;
            }
        }

        .trending-poster-wrapper:hover .trending-poster {
            transform: scale(1.05) rotateY(-5deg) rotateX(5deg);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 50px rgba(0, 210, 255, 0.5);
            border-color: rgba(0, 210, 255, 0.5);
        }

        main {
            position: relative;
            z-index: 10;
            background: #020202;
            padding-top: 2rem;
        }

        .movie-card {
            perspective: 1000px;
            transition: 0.4s;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card-inner {
            width: 140px;
            aspect-ratio: 2/3;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            background: #0a0a0a;
            position: relative;
        }

        @media (min-width: 768px) {
            .card-inner {
                width: 180px;
            }
        }

        .movie-card:hover .card-inner {
            transform: translateY(-10px) rotateX(5deg) scale(1.05);
            border-color: var(--n-red);
            box-shadow: 0 15px 35px rgba(229, 9, 20, 0.4);
        }

        .badge-4k {
            background: var(--n-red);
            font-size: 8px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--n-red);
            color: white;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .btn-modern {
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            backdrop-filter: blur(10px);
            font-weight: 900;
            cursor: pointer;
            border: 1px solid rgba(0, 210, 255, 0.5);
            background: linear-gradient(45deg, rgba(0, 210, 255, 0.1), rgba(0, 210, 255, 0.2));
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            letter-spacing: 0.2em;
        }

        .btn-modern::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-20deg);
            animation: shineBtn 3s infinite;
        }

        @keyframes shineBtn {
            100% {
                left: 200%;
            }
        }

        .btn-modern:hover {
            background: var(--n-blue);
            color: black;
            box-shadow: 0 0 30px var(--n-blue), inset 0 0 10px rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
            border-color: transparent;
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .footer-glow {
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--n-blue), transparent);
            box-shadow: 0 0 20px var(--n-blue);
        }

        .grid-view-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            width: 100%;
        }

        @media (min-width: 640px) {
            .grid-view-container {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 1.5rem;
            }
        }

        @media (min-width: 768px) {
            .grid-view-container {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 1.5rem;
            }
        }

        @media (min-width: 1024px) {
            .grid-view-container {
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 2rem;
            }
        }

        .grid-view-container .movie-card {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .grid-view-container .card-inner {
            width: 100%;
            aspect-ratio: 2/3;
            height: auto;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: 0.3s;
        }

        .suggestion-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .sinhala-font {
            font-family: 'Noto Sans Sinhala', sans-serif !important;
        }

        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.5);
            cursor: pointer;
            position: relative;
            outline: none;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .custom-checkbox:checked {
            background: var(--n-blue);
            border-color: var(--n-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .custom-checkbox:checked::after {
            content: 'âœ”';
            position: absolute;
            color: black;
            font-size: 10px;
            font-weight: 900;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .filter-label {
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: 0.2s;
        }

        .group:hover .filter-label {
            color: white;
        }

        .join-channel-btn {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4), inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            animation: pulseChannelBtn 2s infinite;
            transition: 0.3s;
            transform-style: preserve-3d;
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .join-channel-btn {
                padding: 6px 16px;
                font-size: 10px;
                gap: 6px;
            }
        }

        .join-channel-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.6), inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            color: white;
        }

        @keyframes pulseChannelBtn {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5);
            }

            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(37, 211, 102, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        .bug-report-btn {
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(255, 8, 68, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
        }

        .bug-report-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 8, 68, 0.6), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
        }

        .category-row-container {
            content-visibility: auto;
            contain-intrinsic-size: 300px;
        }

        .ad-container {
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ad-container iframe {
            max-width: 100% !important;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.4);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 210, 255, 0.6);
        }

        .search-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border-radius: 9999px;
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        .search-container:focus-within {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            transform: scale(1.02);
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #aaa;
            backdrop-filter: blur(5px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .category-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: rgba(0, 210, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .category-btn.active {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(229, 9, 20, 0.2));
            border-color: rgba(0, 210, 255, 0.5);
            color: white;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2) inset;
        }

        @keyframes slideInDownFade {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-header {
            animation: slideInDownFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUpStagger {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-cats {
            animation: fadeInUpStagger 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.3s;
            opacity: 0;
        }


        /* --- LogoLoop & BorderGlow CSS --- */
        .logoloop {
            position: relative;
            --logoloop-gap: 40px;
            --logoloop-logoHeight: 40px;
            --logoloop-fadeColorAuto: #020202;
            width: 100%;
        }

        @media(min-width: 768px) {
            .logoloop {
                --logoloop-logoHeight: 60px;
                --logoloop-gap: 60px;
            }
        }

        .logoloop__track {
            display: flex;
            width: max-content;
            will-change: transform;
            user-select: none;
            position: relative;
            z-index: 0;
        }

        .logoloop__list {
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .logoloop__item {
            flex: 0 0 auto;
            margin-right: var(--logoloop-gap);
            font-size: var(--logoloop-logoHeight);
            line-height: 1;
        }

        .logoloop__item img {
            height: var(--logoloop-logoHeight);
            width: auto;
            display: block;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            -webkit-user-drag: none;
            pointer-events: auto;
            /* allow hover */
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), filter 0.3s;
            /* filter removed */
        }

        .logoloop--scale-hover .logoloop__item {
            overflow: visible;
        }

        .logoloop--scale-hover .logoloop__item:hover img {
            transform: scale(1.3);
            transform-origin: center center;
            /* filter removed */
        }

        .logoloop--fade::before,
        .logoloop--fade::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: clamp(24px, 15%, 120px);
            pointer-events: none;
            z-index: 10;
        }

        .logoloop--fade::before {
            left: 0;
            background: linear-gradient(to right, var(--logoloop-fadeColor, var(--logoloop-fadeColorAuto)) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .logoloop--fade::after {
            right: 0;
            background: linear-gradient(to left, var(--logoloop-fadeColor, var(--logoloop-fadeColorAuto)) 0%, rgba(0, 0, 0, 0) 100%);
        }

        /* BorderGlow */
        .border-glow-card {
            --edge-proximity: 0;
            --cursor-angle: 45deg;
            --edge-sensitivity: 30;
            --color-sensitivity: calc(var(--edge-sensitivity) + 20);
            --border-radius: 28px;
            --glow-padding: 40px;
            --cone-spread: 25;
            position: relative;
            border-radius: var(--border-radius);
            isolation: isolate;
            transform: translate3d(0, 0, 0.01px);
            display: grid;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: var(--card-bg, #120F17);
            overflow: visible;
        }

        .border-glow-card::before,
        .border-glow-card::after,
        .border-glow-card>.edge-light {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            transition: opacity 0.25s ease-out;
            z-index: -1;
        }

        /* Glow always visible */
        .border-glow-card::before {
            border: 1px solid transparent;
            background:
                linear-gradient(var(--card-bg, #120F17) 0 100%) padding-box,
                linear-gradient(rgb(255 255 255 / 0%) 0% 100%) border-box,
                var(--gradient-one) border-box, var(--gradient-two) border-box,
                var(--gradient-three) border-box, var(--gradient-four) border-box,
                var(--gradient-five) border-box, var(--gradient-six) border-box,
                var(--gradient-seven) border-box, var(--gradient-base) border-box;
            opacity: calc(0.3 + (var(--edge-proximity) - var(--color-sensitivity)) / (100 - var(--color-sensitivity)));
            mask-image: conic-gradient(from var(--cursor-angle) at center, black calc(var(--cone-spread) * 1%), transparent calc((var(--cone-spread) + 15) * 1%), transparent calc((100 - var(--cone-spread) - 15) * 1%), black calc((100 - var(--cone-spread)) * 1%));
        }

        .border-glow-card::after {
            border: 1px solid transparent;
            background:
                var(--gradient-one) padding-box, var(--gradient-two) padding-box,
                var(--gradient-three) padding-box, var(--gradient-four) padding-box,
                var(--gradient-five) padding-box, var(--gradient-six) padding-box,
                var(--gradient-seven) padding-box, var(--gradient-base) padding-box;
            mask-image: linear-gradient(to bottom, black, black), radial-gradient(ellipse at 50% 50%, black 40%, transparent 65%), radial-gradient(ellipse at 66% 66%, black 5%, transparent 40%), radial-gradient(ellipse at 33% 33%, black 5%, transparent 40%), radial-gradient(ellipse at 66% 33%, black 5%, transparent 40%), radial-gradient(ellipse at 33% 66%, black 5%, transparent 40%), conic-gradient(from var(--cursor-angle) at center, transparent 5%, black 15%, black 85%, transparent 95%);
            mask-composite: subtract, add, add, add, add, add;
            opacity: calc(0.5 * (var(--edge-proximity) - var(--color-sensitivity)) / (100 - var(--color-sensitivity)));
            mix-blend-mode: soft-light;
        }

        .border-glow-card>.edge-light {
            inset: calc(var(--glow-padding) * -1);
            pointer-events: none;
            z-index: 1;
            mask-image: conic-gradient(from var(--cursor-angle) at center, black 2.5%, transparent 10%, transparent 90%, black 97.5%);
            opacity: calc(0.3 + (var(--edge-proximity) - var(--edge-sensitivity)) / (100 - var(--edge-sensitivity)));
            mix-blend-mode: plus-lighter;
        }

        .border-glow-card>.edge-light::before {
            content: "";
            position: absolute;
            inset: var(--glow-padding);
            border-radius: inherit;
            box-shadow:
                inset 0 0 0 1px var(--glow-color), inset 0 0 1px 0 var(--glow-color-60),
                inset 0 0 3px 0 var(--glow-color-50), inset 0 0 6px 0 var(--glow-color-40),
                inset 0 0 15px 0 var(--glow-color-30), inset 0 0 25px 2px var(--glow-color-20),
                inset 0 0 50px 2px var(--glow-color-10), 0 0 1px 0 var(--glow-color-60),
                0 0 3px 0 var(--glow-color-50), 0 0 6px 0 var(--glow-color-40),
                0 0 15px 0 var(--glow-color-30), 0 0 25px 2px var(--glow-color-20),
                0 0 50px 2px var(--glow-color-10);
        }

        .border-glow-inner {
            overflow: hidden;
            position: relative;
            z-index: 1;
            padding: 1.5rem 1rem;
            background: linear-gradient(90deg, #72e9ff 0%, #8762f8 50%, #f68afc 100%);
            border-radius: inherit;
            backdrop-filter: blur(10px);
        }
    </style>

    <style>
        #global_netflix_loader {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background-color: #020202;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #global_netflix_loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #global_netflix_loader.active {
            opacity: 1;
            visibility: visible;
        }

        .cinematic-loader {
            width: 80px;
            height: 80px;
            position: relative;
        }

        .cinematic-loader::before,
        .cinematic-loader::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid transparent;
            animation: spin 2s linear infinite;
        }

        .cinematic-loader::before {
            border-top-color: #00d2ff;
            animation-duration: 1.5s;
            animation-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .cinematic-loader::after {
            border-bottom-color: #e50914;
            animation-duration: 2s;
            animation-direction: reverse;
            animation-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .cinematic-glow {
            position: absolute;
            top: 50%;

            const loader = document.getElementById('global_netflix_loader');

                loader.classList.remove('hidden');
                setTimeout(() => { window.location.href = url; }, 300);
            } else {
                window.location.href = url;
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            const loader = document.getElementById('global_netflix_loader');
            loader.classList.add('hidden');
            loader.classList.remove('active');

            document.body.addEventListener('click', function (e) {
                const anchor = e.target.closest('a');
                if (anchor && anchor.href) {
                    const target = anchor.getAttribute('target');
                    const href = anchor.getAttribute('href');
                    if (target === '_blank' || href.startsWith('javascript:') || href.startsWith('#') || href.startsWith('blob:') || anchor.hasAttribute('download')) return;
                    e.preventDefault();
                    showGlobalLoader(href);
                }
            });

            window.addEventListener('pageshow', (e) => {

                loader.classList.remove('active');
                loader.classList.add('hidden');
            });
        });

        function setupLazyLoadRows() {
            if (!('IntersectionObserver' in window)) {
                return;
            }

            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const rowEl = entry.target;
                        const catId = rowEl.getAttribute('data-cat-id');
                        const hasScraped = MASTER_DATA.some(m => m.category === catId && m.fromPanel !== true);

                        if (!hasScraped && !loadingCats.has(catId)) {
                            loadingCats.add(catId);
                            loadScraperPage(1, catId, true).then(() => {
                                updateCategoryRow(catId);
                            }).catch(err => {
                                console.error(`Lazy load failed for row ${catId}:`, err);
                                updateCategoryRow(catId);
                            }).finally(() => {
                                loadingCats.delete(catId);
                            });
                        } else if (hasScraped) {
                            updateCategoryRow(catId);
                        }
                        obs.unobserve(rowEl);
                    }
                });
            }, {
                rootMargin: "300px 0px 300px 0px"
            });

            document.querySelectorAll('.category-row-container').forEach(row => {
                observer.observe(row);
            });
        }

        let searchTimeout;
        
        async function handleSearchFocus(input) {
            const suggestions = document.getElementById('search_suggestions');
            if (input.value.length >= 2) {
                suggestions.classList.remove('hidden');
                suggestions.classList.add('flex');
            } else {
                // Fetch trending searches
                suggestions.classList.remove('hidden');
                suggestions.classList.add('flex');
                suggestions.innerHTML = `<div class="p-5 text-center text-[10px] text-[#00d2ff] font-bold uppercase tracking-widest"><i class="fa fa-spinner fa-spin mr-2"></i> Loading Trending...</div>`;
                
                try {
                    const res = await fetch('https://stream.moviestream.lat/api/trending-searches');
                    const json = await res.json();
                    if (json && json.data && json.data.length > 0) {
                        let html = `<div class="p-3 text-[10px] text-gray-500 font-bold uppercase tracking-widest border-b border-white/10">Trending Searches</div>`;
                        json.data.forEach(item => {
                            const titleStr = item.title.replace(/'/g, "\\'");
                            html += `<div class="p-3 border-b border-white/5 text-xs text-gray-300 hover:text-white hover:bg-white/5 cursor-pointer flex items-center transition" onclick="document.getElementById('main_search').value='${titleStr}'; liveSearch('${titleStr}');">
                                <i class="fa fa-fire text-[#E50914] mr-3"></i> ${item.title}
                            </div>`;
                        });
                        suggestions.innerHTML = html;
                    } else {
                        suggestions.innerHTML = `<div class="p-3 text-xs text-gray-500">Type to search...</div>`;
                    }
                } catch (e) {
                    suggestions.innerHTML = `<div class="p-3 text-xs text-gray-500">Type to search...</div>`;
                }
            }
        }

        async function liveSearch(q) {
            const suggestions = document.getElementById('search_suggestions');
            document.getElementById('clear_search').style.display = q.length > 0 ? 'block' : 'none';
            clearTimeout(searchTimeout);

            if (q.length === 0) {
                handleSearchFocus(document.getElementById('main_search'));
                return;
            }

            if (q.length < 2) {
                suggestions.classList.add('hidden');
                return;
            }

            // Search local MASTER_DATA (Panel movies + currently loaded scraper movies)
            let filteredLocal = [];
            let uniqueTitles = new Set();

            // Check global database if available
            let sourceData = (window.allMoviesData && window.allMoviesData.length > 0) ? window.allMoviesData : MASTER_DATA;

            sourceData.forEach(m => {
                if (!m.title) return;
                if (m.title.toLowerCase().includes(q.toLowerCase())) {
                    const t = m.title.toLowerCase().trim();
                    if (!uniqueTitles.has(t)) {
                        uniqueTitles.add(t);
                        filteredLocal.push(m);
                    }
                }
            });

            const renderSuggestions = (items) => {
                suggestions.classList.remove('hidden');
                suggestions.classList.add('flex');
                if (items.length > 0) {
                    suggestions.innerHTML = items.slice(0, 15).map(m => `
                        <div class="suggestion-item" onclick="handleMovieClick('${m._id || m.id || m.subjectId}', '${m.detailPath || ""}', ${m.fromPanel === true})">
                            <img src="${m.imageUrl || m.coverImage || m.coverUrl}" class="w-10 h-14 object-cover rounded border border-white/10 shadow-md" onerror="this.src='https://via.placeholder.com/100?text=No+Image'">
                            <div class="overflow-hidden flex flex-col justify-center">
                                <h4 class="text-white text-[11px] md:text-[12px] font-black uppercase truncate w-full break-words">${m.title || m.movieName || m.name}</h4>
                                <p class="text-[9px] text-[#00d2ff] font-bold uppercase mt-0.5">${m.year || ''} &bull; ${m.quality || 'HD'}</p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    suggestions.innerHTML = `<div class="p-5 text-center text-[10px] text-gray-500 font-bold uppercase tracking-widest">No Movies Found</div>`;
                }
            };

            if (filteredLocal.length > 0) {
                renderSuggestions(filteredLocal);
            } else {
                suggestions.classList.remove('hidden');
                suggestions.classList.add('flex');
                suggestions.innerHTML = `<div class="p-5 text-center text-[10px] text-[#00d2ff] font-bold uppercase tracking-widest"><i class="fa fa-spinner fa-spin mr-2"></i> Searching Online...</div>`;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    // Search Local MongoDB API
                    let apiItems = [];
                    try {
                        const res = await fetch(`/api/global-search?q=${encodeURIComponent(q)}`);
                        if (res.ok) {
                            const json = await res.json();
                            apiItems = json.items || [];
                        }
                    } catch (err) {}

                    // Also Search Panel API for safety
                    let panelItems = [];
                    try {
                        const panelRes = await fetch(`https://panel.moviestream.lat/api/movies/search?q=${encodeURIComponent(q)}`);
                        if (panelRes.ok) {
                            panelItems = await panelRes.json();
                        }
                    } catch (e) { }

                    if (apiItems.length > 0 || panelItems.length > 0) {
                        const merged = [...filteredLocal];
                        [...apiItems, ...panelItems].forEach(apiM => {
                            const t = (apiM.title || apiM.name || "").toLowerCase().trim();
                            if (!uniqueTitles.has(t) && t !== "") {
                                uniqueTitles.add(t);
                                merged.push(apiM);
                            }
                        });
                        renderSuggestions(merged);
                    } else if (filteredLocal.length === 0) {
                        renderSuggestions([]);
                    }
                } catch (e) {
                    console.error("Live search error:", e);
                    if (filteredLocal.length === 0) renderSuggestions([]);
                }
            }, 600);
        }

        function clearFilters() {
            document.querySelectorAll('.cat-checkbox').forEach(cb => cb.checked = false);
            applyFilters();
        }

        function clearSearch() {
            document.getElementById('main_search').value = '';
            document.getElementById('search_suggestions').classList.add('hidden');
            document.getElementById('clear_search').style.display = 'none';
        }
    </script>
